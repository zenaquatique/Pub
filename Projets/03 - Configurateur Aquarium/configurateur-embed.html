<div class="zaq-builder" id="zaq-builder">
  <div class="zaq-builder__etape">
    <label class="zaq-builder__etape-label" for="zaq-bac">1. Votre bac</label>
    <select class="zaq-builder__select" id="zaq-bac"></select>
  </div>

  <div class="zaq-builder__etape">
    <p class="zaq-builder__etape-label">2. Votre sol</p>
    <div class="zaq-builder__sol-ligne">
      <select class="zaq-builder__select" id="zaq-sol-produit">
        <option value="">— Aucun —</option>
      </select>
      <div class="zaq-builder__hauteurs" role="group" aria-label="Hauteur de sol" id="zaq-hauteurs-sol">
        <button type="button" class="zaq-builder__hauteur" data-hauteur="3">3 cm</button>
        <button type="button" class="zaq-builder__hauteur" data-hauteur="5">5 cm</button>
      </div>
    </div>
    <div class="zaq-builder__sol-ligne" id="zaq-recouvrement-ligne" hidden>
      <label class="zaq-builder__recouvrement-label" for="zaq-sol-recouvrement">Sable de recouvrement (obligatoire par-dessus un sol nutritif)</label>
      <select class="zaq-builder__select" id="zaq-sol-recouvrement"></select>
      <div class="zaq-builder__hauteurs" role="group" aria-label="Hauteur de recouvrement" id="zaq-hauteurs-cap">
        <button type="button" class="zaq-builder__hauteur" data-hauteur="3">3 cm</button>
        <button type="button" class="zaq-builder__hauteur" data-hauteur="5">5 cm</button>
      </div>
    </div>
    <p class="zaq-builder__sol-info" id="zaq-sol-info"></p>
  </div>

  <div class="zaq-builder__principal">
    <div class="zaq-builder__palette" id="zaq-palette"></div>

    <div class="zaq-builder__scene">
      <div class="zaq-builder__tank" id="zaq-tank">
        <div class="zaq-builder__eau"></div>
        <div class="zaq-builder__fond" id="zaq-fond"></div>
        <div class="zaq-builder__fond-cap" id="zaq-fond-cap"></div>
      </div>
      <p class="zaq-builder__astuce">Glissez un produit de la liste vers le bac. Glissez un élément déjà posé pour le déplacer, ou faites-le glisser hors du bac pour le retirer.</p>
      <p class="zaq-builder__capacite" id="zaq-capacite"></p>
    </div>

    <div class="zaq-builder__panier">
      <h4 class="zaq-builder__panier-titre">Votre sélection</h4>
      <ul class="zaq-builder__liste" id="zaq-liste-panier">
        <li class="zaq-builder__liste-vide" id="zaq-liste-vide">Votre bac est vide pour l'instant.</li>
      </ul>
      <p class="zaq-builder__total">Total : <strong id="zaq-total">0,00&nbsp;€</strong></p>
      <button type="button" class="zaq-builder__bouton" id="zaq-ajouter-panier" disabled>Ajouter tout au panier</button>
      <button type="button" class="zaq-builder__bouton-secondaire" id="zaq-vider">Vider le bac</button>
      <p class="zaq-builder__confirmation" id="zaq-confirmation" hidden></p>
    </div>
  </div>
</div>

<style>
  .zaq-builder {
    width: 100%;
    margin: 24px 0;
    padding: 20px;
    border: 2px solid #9dbaa9;
    border-radius: 14px;
    background: #f7faf8;
    font-family: inherit;
    color: #14201a;
    box-sizing: border-box;
    transition: max-width 0.25s ease;
  }
  .zaq-builder *,
  .zaq-builder *::before,
  .zaq-builder *::after { box-sizing: border-box; }

  /* ---- Étapes 1 & 2 (bac, sol) ---- */
  .zaq-builder__etape {
    margin-bottom: 16px;
    padding-bottom: 16px;
    border-bottom: 1px solid #d3e0d8;
  }
  .zaq-builder__etape-label {
    display: block;
    margin: 0 0 8px;
    font-size: 14px;
    font-weight: 800;
    color: #14201a;
  }
  .zaq-builder__select {
    width: 100%;
    max-width: 420px;
    padding: 10px 12px;
    border: 2px solid #6f8a7a;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    background: #fff;
    color: #14201a;
  }
  .zaq-builder__sol-ligne {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }
  .zaq-builder__hauteurs {
    display: flex;
    gap: 8px;
  }
  .zaq-builder__hauteur {
    padding: 9px 16px;
    font-size: 14px;
    font-weight: 700;
    border: 2px solid #2f6b48;
    border-radius: 999px;
    background: #fff;
    color: #235939;
    cursor: pointer;
  }
  .zaq-builder__hauteur[aria-pressed="true"] {
    background: #2f6b48;
    color: #fff;
  }
  .zaq-builder__sol-info {
    margin: 10px 0 0;
    font-size: 13px;
    font-weight: 600;
    color: #3d4a43;
  }
  .zaq-builder__recouvrement-label {
    font-size: 13px;
    font-weight: 700;
    color: #14201a;
  }
  #zaq-recouvrement-ligne {
    margin-top: 10px;
    padding: 10px;
    border-radius: 8px;
    background: #eaf4ee;
  }
  #zaq-recouvrement-ligne[hidden] {
    display: none;
  }

  /* ---- Layout principal (palette | scène | panier) ---- */
  .zaq-builder__principal {
    display: grid;
    grid-template-columns: 240px 1fr 280px;
    gap: 20px;
    align-items: start;
  }
  @media (max-width: 900px) {
    .zaq-builder__principal { grid-template-columns: 1fr; }
  }

  /* ---- Palette : colonnes rétractables par catégorie ---- */
  /* Conteneur bloc simple (pas flex) : un conteneur flex-column avec overflow-y:auto
     ne réduit pas toujours ses enfants correctement (les <details> refusent de
     rétrécir sous leur contenu), ce qui empêchait le défilement de s'activer et
     laissait le contenu déborder hors du cadre au lieu de défiler dedans. */
  .zaq-builder__palette {
    max-height: 640px;
    overflow-y: auto;
    padding-right: 4px;
  }
  .zaq-builder__categorie {
    border: 2px solid #c9d6cd;
    border-radius: 10px;
    background: #fff;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .zaq-builder__categorie:last-child {
    margin-bottom: 0;
  }
  .zaq-builder__categorie-titre {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 12px;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.02em;
    color: #14201a;
    cursor: pointer;
    list-style: none;
  }
  .zaq-builder__categorie-titre::-webkit-details-marker { display: none; }
  .zaq-builder__categorie-titre::after {
    content: '+';
    font-size: 16px;
    font-weight: 700;
    color: #2f6b48;
    transition: transform 0.15s ease;
  }
  .zaq-builder__categorie[open] > .zaq-builder__categorie-titre::after {
    transform: rotate(45deg);
  }
  .zaq-builder__categorie-compte {
    font-weight: 500;
    color: #5b6b60;
  }
  .zaq-builder__categorie-corps {
    padding: 0 8px 8px;
  }
  .zaq-builder__carte {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 8px;
    border: 2px solid #e1e9e4;
    border-radius: 9px;
    background: #fbfdfc;
    cursor: grab;
    touch-action: none;
    user-select: none;
    margin-top: 6px;
  }
  .zaq-builder__carte:active { cursor: grabbing; }
  .zaq-builder__carte-visuel {
    width: 30px;
    height: 30px;
    flex-shrink: 0;
    overflow: hidden;
  }
  .zaq-builder__img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 6px;
    display: block;
  }
  .zaq-builder__carte-texte {
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .zaq-builder__carte-nom {
    font-size: 12.5px;
    font-weight: 700;
    color: #14201a;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .zaq-builder__carte-prix {
    font-size: 12px;
    font-weight: 600;
    color: #2f6b48;
  }

  /* ---- Scène / bac ---- */
  .zaq-builder__scene {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .zaq-builder__tank {
    position: relative;
    width: 100%;
    max-width: var(--zaq-tank-max, 720px);
    margin: 0 auto;
    aspect-ratio: var(--zaq-tank-ratio, 2 / 1);
    border: 8px solid #3a4a42;
    border-radius: 8px;
    overflow: hidden;
    background: #dff0e6;
    /* Pas de transition ici : la taille des objets posés (--zaq-item-size) est
       mesurée en JS juste après un changement de bac — une transition animée
       ferait lire une valeur intermédiaire au lieu de la taille finale. */
  }
  .zaq-builder__eau {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(154, 214, 195, 0.55) 0%, rgba(94, 168, 152, 0.55) 100%);
  }
  .zaq-builder__fond {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 12%;
    background: linear-gradient(180deg, #cba573 0%, #a9834f 100%);
    transition: height 0.2s ease, background 0.2s ease;
  }
  .zaq-builder__fond-cap {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 0;
    background: #c9a876;
    transition: height 0.2s ease, background 0.2s ease, bottom 0.2s ease;
  }
  .zaq-builder__item {
    position: absolute;
    width: var(--zaq-item-size, 46px);
    height: var(--zaq-item-size, 46px);
    transform: translate(-50%, -50%);
    cursor: grab;
    touch-action: none;
    user-select: none;
    transition: width 0.2s ease, height 0.2s ease;
  }
  .zaq-builder__item:active { cursor: grabbing; }
  /* Wrapper séparé (plutôt que overflow:hidden sur .zaq-builder__item directement) :
     le bouton × est positionné hors de la boîte (-8px) et doit rester visible même
     si le visuel (photo cassée, alt trop long...) doit lui être découpé proprement. */
  .zaq-builder__item-visuel {
    width: 100%;
    height: 100%;
    overflow: hidden;
    border-radius: 8px;
  }
  .zaq-builder__item-supprimer {
    position: absolute;
    top: -8px;
    right: -8px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 2px solid #fff;
    background: #b23b3b;
    color: #fff;
    font-size: 12px;
    line-height: 1;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .zaq-builder__astuce {
    margin: 0;
    font-size: 13px;
    color: #3d4a43;
    font-weight: 500;
    text-align: center;
  }
  .zaq-builder__capacite {
    margin: 0;
    font-size: 12.5px;
    font-weight: 600;
    color: #5b6b60;
    text-align: center;
  }
  .zaq-builder__capacite.zaq-builder__capacite--plein {
    color: #a3631f;
  }

  /* ---- Fantôme de glisser ---- */
  .zaq-builder__fantome {
    position: fixed;
    width: var(--zaq-item-size, 46px);
    height: var(--zaq-item-size, 46px);
    overflow: hidden;
    pointer-events: none;
    z-index: 1000;
    opacity: 0.9;
    filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.25));
  }

  /* ---- Panier ---- */
  .zaq-builder__panier {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 16px;
    border: 2px solid #b7d4c1;
    border-radius: 10px;
    background: #eaf4ee;
  }
  .zaq-builder__panier-titre {
    margin: 0;
    font-size: 16px;
    font-weight: 800;
  }
  .zaq-builder__liste {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 320px;
    overflow-y: auto;
  }
  .zaq-builder__liste li {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
  }
  .zaq-builder__liste-vide {
    color: #5b6b60;
    font-weight: 500 !important;
  }
  .zaq-builder__total {
    margin: 4px 0 0;
    padding-top: 8px;
    border-top: 1px solid #b7d4c1;
    font-size: 15px;
    font-weight: 700;
  }
  .zaq-builder__bouton {
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #2f6b48;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  .zaq-builder__bouton:disabled {
    background: #a9bcb0;
    cursor: not-allowed;
  }
  .zaq-builder__bouton-secondaire {
    padding: 8px;
    border: 2px solid #6f8a7a;
    border-radius: 8px;
    background: transparent;
    color: #3d4a43;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .zaq-builder__confirmation {
    margin: 0;
    font-size: 12px;
    font-weight: 600;
    color: #1c4a30;
  }
</style>

<script>
(function () {
  // false = simulation (fonctionne partout, y compris hors Shopify).
  // true  = envoie reellement les articles au panier Shopify via
  //         /cart/add.js - necessite d'avoir renseigne variantId
  //         (l'ID de variante Shopify) pour chaque produit ci-dessous.
  var MODE_SHOPIFY = false;

  function svgFeuille(c) {

  }
  function svgRoche(c) {
    return '<svg viewBox="0 0 40 40" width="100%" height="100%"><path d="M4 30 Q2 18 14 14 Q18 4 28 10 Q38 12 36 24 Q38 34 26 36 Q12 40 4 30 Z" fill="' + c + '"/></svg>';
  }
  function svgCrevette(c) {
    return '<svg viewBox="0 0 40 24" width="100%" height="100%"><path d="M2 14 Q8 3 20 5 Q34 5 38 11 Q30 9 24 11 Q30 15 36 17 Q24 22 14 18 Q4 20 2 14 Z" fill="' + c + '"/></svg>';
  }
  function svgLampe(c) {
    return '<svg viewBox="0 0 40 24" width="100%" height="100%"><rect x="2" y="2" width="36" height="8" rx="3" fill="' + c + '"/><line x1="8" y1="14" x2="8" y2="22" stroke="' + c + '" stroke-width="2" opacity="0.5"/><line x1="20" y1="14" x2="20" y2="22" stroke="' + c + '" stroke-width="2" opacity="0.5"/><line x1="32" y1="14" x2="32" y2="22" stroke="' + c + '" stroke-width="2" opacity="0.5"/></svg>';
  }
  function svgThermometre(c) {
    return '<svg viewBox="0 0 20 40" width="100%" height="100%"><rect x="6" y="2" width="8" height="26" rx="4" fill="' + c + '"/><circle cx="10" cy="32" r="6" fill="' + c + '"/></svg>';
  }
  function svgFiltre(c) {
    return '<svg viewBox="0 0 40 40" width="100%" height="100%"><rect x="10" y="4" width="20" height="30" rx="6" fill="' + c + '"/><rect x="16" y="34" width="8" height="4" fill="' + c + '"/></svg>';
  }
  function svgBulle(c) {
    return '<svg viewBox="0 0 40 40" width="100%" height="100%"><circle cx="14" cy="26" r="8" fill="' + c + '" opacity="0.85"/><circle cx="26" cy="14" r="5" fill="' + c + '" opacity="0.6"/></svg>';
  }
  function svgOutil(c) {
    return '<svg viewBox="0 0 40 40" width="100%" height="100%"><rect x="17" y="4" width="6" height="24" rx="3" fill="' + c + '"/><circle cx="20" cy="32" r="7" fill="' + c + '" opacity="0.6"/></svg>';
  }
  function svgSable(c) {
    return '<svg viewBox="0 0 40 40" width="100%" height="100%"><rect x="2" y="14" width="36" height="20" rx="4" fill="' + c + '"/><circle cx="10" cy="24" r="1.6" fill="rgba(0,0,0,0.18)"/><circle cx="20" cy="20" r="1.6" fill="rgba(0,0,0,0.18)"/><circle cx="28" cy="26" r="1.6" fill="rgba(0,0,0,0.18)"/></svg>';
  }

  // Petit raccourci pour déclarer un produit : prixApprox=true => prix "≈", à vérifier
  // dans l'admin Shopify. "image" (optionnel, 5e argument) accepte une URL vers une
  // vraie photo produit — dès qu'elle est renseignée, elle remplace le pictogramme
  // SVG de la catégorie. Laisser vide tant qu'on n'a pas l'URL : le pictogramme
  // continue de s'afficher, rien d'autre ne casse.
  function pr(id, nom, prix, prixApprox, image) {
    return { id: id, nom: nom, prix: prix, prixApprox: !!prixApprox, variantId: null, image: image || null };
  }
  function echapperHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  }
  // Visuel effectif d'un produit : sa photo si renseignée, sinon le pictogramme
  // de secours de sa catégorie.
  function rendreVisuel(produit) {
    if (produit.image) {
      return '<img class="zaq-builder__img" src="' + echapperHtml(produit.image) + '" alt="' + echapperHtml(produit.nom) + '" loading="lazy">';
    }
    return ICONE_PAR_PRODUIT[produit.id] || '';
  }

  // Catalogue (hors packs et carte-cadeau, cf. demande d'Owen)

    {

        pr('hygrophila-disformis', 'Hygrophila Disformis', 1.99),
        pr('hygrophila-corymbosa', 'Hygrophila Corymbosa', 1.99),
        pr('limnophilia-sessiliflora', 'Limnophilia Sessiliflora', 0.99),
        pr('limnobium-laevigatum', 'Limnobium Laevigatum', 1.50),
        pr('valisneria-spiralis', 'Valisneria Spiralis', 1.99),
        pr('valisneria-gigantea', 'Valisnéria gigantea', 2.99, true),
        pr('sagittaria-subulata', 'Sagittaria Subulata', 1.50),
        pr('lysimachia-nummularia-aurea', 'Lysimachia Nummularia Aurea', 1.99),
        pr('ludwigia-repens', 'Ludwigia Repens', 1.50),
        pr('egeria-densa', 'Egeria Densa', 0.99),
        pr('anubias-barteri-nana', 'Anubias Barteri Nana', 4.99),
        pr('pogostemon-helferi', 'Pogostemon Helferi', 1.99),
        pr('alternanthera-reinekii-red-ruby', 'Alternanthera Reinekii Red Ruby', 1.99),
        pr('bucephalandra-red-scorpio', 'Bucephalandra Red Scorpio', 3.99),
        pr('nymphaea-lotus-red', 'Nymphaea lotus Red', 4.99),
        pr('mayaca-fluviatilis', 'Mayaca Fluviatilis', 1.50),
        pr('microsorium-pteroptus', 'Microsorium Ptéroptus', 2.99),
        pr('echinodorus-bleheri', 'Echinodorus bleheri', 1.99),
        pr('taxiphyllum-taiwan-moss', 'Taxiphyllum Taïwan Moss', 2.99),
        pr('taxiphyllum-spiky-moss', 'Taxiphullum Spiky Moss', 2.99, true),
        pr('taxiphyllum-bogor-moss', "Mousse de java (Bogor Moss)", 2.99),
        pr('micranthemum-monte-carlo', 'Micranthemum Monte Carlo', 2.99)
      ]
    },
    {
      id: 'crevettes', nom: 'Crevettes & accessoires', icone: svgCrevette('#e0793c'),
      produits: [
        pr('neocaridina-red-cherry', 'Neocaridina Red Cherry', 1.99, true),
        pr('neocaridina-orange-cherry', 'Neocaridina Orange Cherry', 1.99),
        pr('neocaridina-yellow-neon', 'Neocaridina Yellow Néon', 2.50),
        pr('neocaridina-rili-red', 'Neocaridina Rili Red', 2.50, true),
        pr('neocaridina-blue-velvette', 'Neocaridina Blue Velvette', 2.99, true),
        pr('dome-mousse-crevettes', 'Dôme à Mousse Pour Crevettes', 4.99, true),
        pr('mangeoire-crevettes', 'Mangeoire pour crevettes', 3.99, true),
        pr('epuisette-crevettes', 'Épuisette à Crevettes Rigide', 3.99, true)
      ]
    },
    {
      id: 'deco', nom: 'Décoration', icone: svgRoche('#8a7a63'),
      produits: [
        pr('dragon-stone', 'Dragon Stone', 5.99),
        pr('black-rock', 'Black Rock', 5.99),
        pr('racine-spider-xs', 'Racine Spider XS', 6.99),
        pr('racine-spider-s', 'Racine Spider S', 10.99),
        pr('bois-honeycomb-s', 'Bois HoneyComb S', 14.99)
      ]
    },
    {
      id: 'eclairage', nom: 'Éclairage', icone: svgLampe('#c9a13a'),
      produits: [
        pr('superfish-ecoled-54-64', 'Super fish Eco-Led 54-64cm', 24.99, true),
        pr('superfish-ecoled-64-74', 'Super fish Eco-Led 64-74cm', 29.99, true),

  // ---------- Étape 1 : sélection du bac ----------
  function rendreBacs() {
    elBac.innerHTML = BACS.map(function (b) {
      return '<option value="' + b.id + '">' + b.nom + ' — ' + b.longueur + '×' + b.largeur + '×' + b.hauteur + ' cm — ' + texteLignePrix(b) + '</option>';
    }).join('');
    elBac.value = bacActuel.id;
  }
  function appliquerBac() {
    elTank.style.setProperty('--zaq-tank-max', bacActuel.largeurAffichage + 'px');
    elTank.style.setProperty('--zaq-tank-ratio', bacActuel.longueur + ' / ' + bacActuel.hauteur);
    // Le widget ne doit JAMAIS forcer la page/le thème à s'élargir : il reste
    // toujours à 100% de la largeur que la page lui donne. Le bac grandit donc
    // seulement dans la limite de la place réellement disponible (via sa propre
    // max-width ci-dessus), jamais en poussant le conteneur de la page.
    //
    // La taille des éléments posés (plantes, déco...) est mise à l'échelle de la
    // largeur RÉELLEMENT affichée du bac (mesurée après mise en page), pas de sa
    // taille "théorique" : sur une page étroite où le bac est contraint, les
    // éléments restent proportionnés à ce qui est vraiment visible.
    var largeurReelle = elTank.getBoundingClientRect().width || bacActuel.largeurAffichage;
    var tailleItem = Math.max(34, Math.min(84, Math.round(largeurReelle / 13)));
    document.documentElement.style.setProperty('--zaq-item-size', tailleItem + 'px');
    if (solActuel) calculerEtAppliquerSol();
    rafraichirCapacite();
  }
  elBac.addEventListener('change', function () {
    bacActuel = BACS.filter(function (b) { return b.id === elBac.value; })[0];
    appliquerBac();
    sauvegarder();
  });

  // ---------- Étape 2 : sélection du sol ----------
  function rendreSol() {
    elSolProduit.innerHTML = '<option value="">— Aucun —</option>' + PRODUITS_SOL.map(function (s) {
      return '<option value="' + s.id + '">' + s.nom + ' — ' + texteLignePrix(s) + '</option>';
    }).join('');
    elSolRecouvrement.innerHTML = SABLES_RECOUVREMENT.map(function (s) {
      return '<option value="' + s.id + '">' + s.nom + ' — ' + texteLignePrix(s) + '</option>';
    }).join('');
  }
  function calculerSacs(produit, hauteurCm) {
    var volumeL = (bacActuel.longueur * bacActuel.largeur * hauteurCm / 1000) * 1.1; // +10% marge, cf. Projet 02
    var contenanceL = produit.contenanceL || (produit.contenanceKg / produit.densiteKgParL);
    var sacs = Math.ceil(volumeL / contenanceL);
    return { volumeL: volumeL, sacs: sacs };
  }
  function calculerEtAppliquerSol() {
    var produitSol = PRODUITS_PAR_ID_SOL(solActuel.produitId);
    if (!produitSol) return;

    if (produitSol.type === 'nutritif') {
      if (!solActuel.capProduitId) solActuel.capProduitId = SABLES_RECOUVREMENT[0].id;
      if (!solActuel.capHauteurCm) solActuel.capHauteurCm = 3;
      var produitCap = PRODUITS_PAR_ID_SOL(solActuel.capProduitId);
      var hauteurSolCm = solActuel.hauteurCm;
      var hauteurCapCm = solActuel.capHauteurCm;
      var hauteurTotaleCm = hauteurSolCm + hauteurCapCm;
      var hauteurSolPct = Math.max(4, Math.min(35, (hauteurSolCm / bacActuel.hauteur) * 100));
      var hauteurCapPct = Math.max(4, Math.min(35, (hauteurCapCm / bacActuel.hauteur) * 100));

      elFond.style.height = hauteurSolPct + '%';
      elFond.style.background = produitSol.couleur;
      elFondCap.style.bottom = hauteurSolPct + '%';
      elFondCap.style.height = hauteurCapPct + '%';
      elFondCap.style.background = produitCap.couleur;

      var calcSol = calculerSacs(produitSol, hauteurSolCm);
      var calcCap = calculerSacs(produitCap, hauteurCapCm);
      solActuel.sacs = calcSol.sacs;
      solActuel.volumeL = calcSol.volumeL;
      solActuel.sacsCap = calcCap.sacs;
      solActuel.volumeLCap = calcCap.volumeL;

      elSolInfo.textContent =
        'Sol nutritif (' + hauteurSolCm + ' cm) : ' + calcSol.volumeL.toLocaleString('fr-FR', { maximumFractionDigits: 1 }) + ' L → ' + calcSol.sacs + ' sac' + (calcSol.sacs > 1 ? 's' : '') +
        ' · Recouvrement (' + hauteurCapCm + ' cm) : ' + calcCap.volumeL.toLocaleString('fr-FR', { maximumFractionDigits: 1 }) + ' L → ' + calcCap.sacs + ' sac' + (calcCap.sacs > 1 ? 's' : '') +
        ' · Hauteur totale : ' + hauteurTotaleCm + ' cm. Les deux sont ajoutés au panier.';

      elRecouvrementLigne.hidden = false;
      elSolRecouvrement.value = solActuel.capProduitId;
      boutonsHauteurCap.forEach(function (b) {
        b.setAttribute('aria-pressed', parseInt(b.getAttribute('data-hauteur'), 10) === hauteurCapCm ? 'true' : 'false');
      });
    } else {
      solActuel.capProduitId = null;
      solActuel.sacsCap = 0;
      solActuel.volumeLCap = 0;

      var hauteurPct = Math.max(6, Math.min(40, (solActuel.hauteurCm / bacActuel.hauteur) * 100));
      elFond.style.height = hauteurPct + '%';
      elFond.style.background = produitSol.couleur;
      elFondCap.style.height = '0';

      var calc = calculerSacs(produitSol, solActuel.hauteurCm);
      solActuel.sacs = calc.sacs;
      solActuel.volumeL = calc.volumeL;
      elSolInfo.textContent = 'Volume nécessaire : ' + calc.volumeL.toLocaleString('fr-FR', { maximumFractionDigits: 1 }) + ' L → ' + calc.sacs + ' sac' + (calc.sacs > 1 ? 's' : '') + ' ajouté' + (calc.sacs > 1 ? 's' : '') + ' au panier.';

      elRecouvrementLigne.hidden = true;
    }
  }
  function PRODUITS_PAR_ID_SOL(id) {
    return PRODUITS_SOL.filter(function (s) { return s.id === id; })[0];

  elSolProduit.addEventListener('change', function () {

  // ---------- Rendu palette (colonnes rétractables) ----------

  // ---------- Rendu bac ----------
  function rendreTank() {
    racine.querySelectorAll('.zaq-builder__item').forEach(function (el) { el.remove(); });
    placedItems.forEach(function (item) {
      var produit = PRODUITS_PAR_ID[item.produitId];
      if (!produit) return;
      var el = document.createElement('div');
      el.className = 'zaq-builder__item';
      el.setAttribute('data-uid', item.uid);
      el.style.left = item.xPct + '%';
      el.style.top = item.yPct + '%';
      el.style.zIndex = item.zIndex;
      el.innerHTML = '<div class="zaq-builder__item-visuel">' + rendreVisuel(produit) + '</div><span class="zaq-builder__item-supprimer" title="Retirer">×</span>';
      el.querySelector('.zaq-builder__item-supprimer').addEventListener('pointerdown', function (e) {
        e.stopPropagation();
      });
      el.querySelector('.zaq-builder__item-supprimer').addEventListener('click', function (e) {
        e.stopPropagation();
        retirerItem(item.uid);
      });
      el.addEventListener('pointerdown', function (e) {
        demarrerGlisser(produit, e, item.uid);
      });
      elTank.appendChild(el);
    });
  }

  function rafraichirCapacite() {
    var n = placedItems.length;
    var max = bacActuel.capaciteIndicative;
    elCapacite.textContent = n + ' / ~' + max + ' éléments conseillés pour ce bac';
    elCapacite.classList.toggle('zaq-builder__capacite--plein', n > max);
  }

  // ---------- Rendu panier ----------
  function rendrePanier() {
    var groupes = {};
    placedItems.forEach(function (item) {
      groupes[item.produitId] = (groupes[item.produitId] || 0) + 1;
    });
    var idsPlaces = Object.keys(groupes);

    var html = '';
    var total = 0;

    if (solActuel && solActuel.sacs) {
      var produitSol = PRODUITS_PAR_ID_SOL(solActuel.produitId);
      var ligneTotalSol = produitSol.prix * solActuel.sacs;
      total += ligneTotalSol;
      html += '<li><span>' + solActuel.sacs + '× ' + produitSol.nom + ' (' + solActuel.hauteurCm + ' cm)</span><span>' + formaterPrix(ligneTotalSol) + '</span></li>';

      if (solActuel.capProduitId && solActuel.sacsCap) {
        var produitCap = PRODUITS_PAR_ID_SOL(solActuel.capProduitId);
        var ligneTotalCap = produitCap.prix * solActuel.sacsCap;
        total += ligneTotalCap;
        html += '<li><span>' + solActuel.sacsCap + '× ' + produitCap.nom + ' (recouvrement, ' + solActuel.capHauteurCm + ' cm)</span><span>' + formaterPrix(ligneTotalCap) + '</span></li>';
      }
    }

    idsPlaces.forEach(function (id) {
      var produit = PRODUITS_PAR_ID[id];
      var qte = groupes[id];
      var ligneTotal = produit.prix * qte;
      total += ligneTotal;
      html += '<li><span>' + qte + '× ' + produit.nom + '</span><span>' + formaterPrix(ligneTotal) + '</span></li>';
    });

    if (!html) {
      elListe.innerHTML = '<li class="zaq-builder__liste-vide" id="zaq-liste-vide">Votre bac est vide pour l\'instant.</li>';
      elBoutonAjouter.disabled = true;
      elTotal.textContent = formaterPrix(0);
      return;
    }

    elListe.innerHTML = html;
    elTotal.textContent = formaterPrix(total);
    elBoutonAjouter.disabled = false;
  }

  function rafraichir() {
    rendreTank();
    rendrePanier();
    rafraichirCapacite();
    sauvegarder();
  }

  // ---------- Persistance (localStorage, par visiteur) ----------
  function sauvegarder() {
    try {
      var donnees = {
        bacId: bacActuel.id,
        sol: solActuel,
        items: placedItems.map(function (i) {
          return { produitId: i.produitId, xPct: i.xPct, yPct: i.yPct };
        })
      };
      window.localStorage.setItem(CLE_STOCKAGE, JSON.stringify(donnees));
    } catch (err) { /* stockage indisponible : on continue sans sauvegarde */ }
  }
  function charger() {
    try {
      var brut = window.localStorage.getItem(CLE_STOCKAGE);
      if (!brut) return;
      var donnees = JSON.parse(brut);
      if (donnees.bacId) {
        var bacTrouve = BACS.filter(function (b) { return b.id === donnees.bacId; })[0];
        if (bacTrouve) bacActuel = bacTrouve;
      }
      if (donnees.sol && PRODUITS_PAR_ID_SOL(donnees.sol.produitId)) {
        solActuel = donnees.sol;
      }
      (donnees.items || []).forEach(function (d) {
        if (!PRODUITS_PAR_ID[d.produitId]) return;
        placedItems.push({ uid: prochainUid++, produitId: d.produitId, xPct: d.xPct, yPct: d.yPct, zIndex: zIndexCourant++ });
      });
    } catch (err) { /* données corrompues ou stockage indisponible : on repart à vide */ }
  }

  // ---------- Actions sur les items du bac ----------
  function ajouterItem(produit, xPct, yPct) {
    placedItems.push({ uid: prochainUid++, produitId: produit.id, xPct: xPct, yPct: yPct, zIndex: zIndexCourant++ });
    rafraichir();
  }
  function deplacerItem(uid, xPct, yPct) {
    var item = placedItems.filter(function (i) { return i.uid === uid; })[0];
    if (!item) return;
    item.xPct = xPct;
    item.yPct = yPct;
    item.zIndex = zIndexCourant++;
    rafraichir();
  }
  function retirerItem(uid) {
    placedItems = placedItems.filter(function (i) { return i.uid !== uid; });
    rafraichir();
  }

  // ---------- Glisser-déposer (pointer events, souris + tactile) ----------
  function positionnerFantome(el, x, y) {
    // La taille du fantôme suit --zaq-item-size (variable selon la taille du bac) :
    // on centre donc sur sa taille réelle plutôt qu'une moitié fixe.
    var demiTaille = el.offsetWidth / 2 || 25;
    el.style.left = (x - demiTaille) + 'px';
    el.style.top = (y - demiTaille) + 'px';
  }

  function demarrerGlisser(produit, evenement, uidExistant) {
    evenement.preventDefault();

    var elReel = null;
    if (uidExistant !== null) {
      elReel = elTank.querySelector('[data-uid="' + uidExistant + '"]');
      if (elReel) elReel.style.visibility = 'hidden';
    }

    var fantome = document.createElement('div');
    fantome.className = 'zaq-builder__fantome';
    fantome.innerHTML = rendreVisuel(produit);
    document.body.appendChild(fantome);
    positionnerFantome(fantome, evenement.clientX, evenement.clientY);

    function surDeplacement(e) {
      positionnerFantome(fantome, e.clientX, e.clientY);
    }

    function surRelachement(e) {
      document.removeEventListener('pointermove', surDeplacement);
      document.removeEventListener('pointerup', surRelachement);
      fantome.remove();
      if (elReel) elReel.style.visibility = '';

      var rectTank = elTank.getBoundingClientRect();
      var dansLeBac =
        e.clientX >= rectTank.left && e.clientX <= rectTank.right &&
        e.clientY >= rectTank.top && e.clientY <= rectTank.bottom;

      if (dansLeBac) {
        // "left/top: X%" sur un élément posé se calcule par rapport à la boîte de
        // padding du bac (donc SANS sa bordure de 8px), alors que getBoundingClientRect()
        // inclut la bordure : sans cette correction, le point posé dérive de quelques
        // px vers la droite/le bas selon l'endroit du bac où on lâche.
        var cs = getComputedStyle(elTank);
        var bordureG = parseFloat(cs.borderLeftWidth) || 0;
        var bordureH = parseFloat(cs.borderTopWidth) || 0;
        var xPct = ((e.clientX - rectTank.left - bordureG) / elTank.clientWidth) * 100;
        var yPct = ((e.clientY - rectTank.top - bordureH) / elTank.clientHeight) * 100;
        xPct = Math.max(3, Math.min(97, xPct));
        yPct = Math.max(6, Math.min(94, yPct));
        if (uidExistant !== null) {
          deplacerItem(uidExistant, xPct, yPct);
        } else {
          ajouterItem(produit, xPct, yPct);
        }
      } else if (uidExistant !== null) {
        retirerItem(uidExistant);
      }
    }

    document.addEventListener('pointermove', surDeplacement);
    document.addEventListener('pointerup', surRelachement);
  }

  // ---------- Ajouter tout au panier ----------
  function ajouterAuPanier() {
    var groupes = {};
    placedItems.forEach(function (item) {
      groupes[item.produitId] = (groupes[item.produitId] || 0) + 1;
    });
    var lignes = Object.keys(groupes).map(function (id) {
      return { produit: PRODUITS_PAR_ID[id], quantite: groupes[id] };
    });
    if (solActuel && solActuel.sacs) {
      lignes.push({ produit: PRODUITS_PAR_ID_SOL(solActuel.produitId), quantite: solActuel.sacs });
      if (solActuel.capProduitId && solActuel.sacsCap) {
        lignes.push({ produit: PRODUITS_PAR_ID_SOL(solActuel.capProduitId), quantite: solActuel.sacsCap });
      }
    }
    if (lignes.length === 0) return;

    if (MODE_SHOPIFY) {
      var items = lignes.map(function (l) {
        return { id: l.produit.variantId, quantity: l.quantite };
      });
      fetch('/cart/add.js', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ items: items })
      })
        .then(function (r) { return r.json(); })
        .then(function () { window.location.href = '/cart'; })
        .catch(function () {
          elConfirmation.hidden = false;
          elConfirmation.textContent = 'Erreur lors de l\'ajout au panier. Merci de réessayer.';
        });
      return;
    }

    var resume = lignes.map(function (l) {
      return l.quantite + '× ' + l.produit.nom;
    }).join(', ');
    elConfirmation.hidden = false;
    elConfirmation.textContent = '(Simulation) Ajouté au panier : ' + resume;
  }

  elBoutonAjouter.addEventListener('click', ajouterAuPanier);
  elBoutonVider.addEventListener('click', function () {
    placedItems = [];
    elConfirmation.hidden = true;
    rafraichir();
  });

  rendreBacs();
  rendreSol();
  rendrePalette();
  charger();
  elBac.value = bacActuel.id;
  if (solActuel) {
    elSolProduit.value = solActuel.produitId;
    boutonsHauteurSol.forEach(function (b) {
      b.setAttribute('aria-pressed', parseInt(b.getAttribute('data-hauteur'), 10) === solActuel.hauteurCm ? 'true' : 'false');
    });
  }
  appliquerBac();
  rafraichir();
})();
</script>
